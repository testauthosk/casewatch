<!DOCTYPE html>
<html lang="en" class="nojs auth-page">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in to CaseCheck</title>
<meta name="description" content="Log in to CaseCheck to see your immigration court case status and alerts.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<script defer src="assets/lang.js"></script>
<script defer src="assets/theme.js"></script>
<script defer src="assets/app.js"></script>

<link rel="canonical" href="https://uscasecheck.com/login.html">
<link rel="alternate" hreflang="en" href="https://uscasecheck.com/login.html">
<link rel="alternate" hreflang="es" href="https://uscasecheck.com/es/login.html">
<link rel="alternate" hreflang="hi" href="https://uscasecheck.com/hi/login.html">
<link rel="alternate" hreflang="ru" href="https://uscasecheck.com/ru/login.html">
<link rel="alternate" hreflang="x-default" href="https://uscasecheck.com/login.html">
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="index.html" class="brand">
      <svg class="mk" viewBox="0 0 32 32"><path d="M16 2 27 6v9c0 7-5 12-11 15C10 27 5 22 5 15V6z" fill="#12A98D"/><path d="M11 16l3.5 3.5L21 12" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <b>Case<span>Check</span></b>
    </a>
    <div class="act" style="margin-left:auto;">
      <span class="lang">EN ▾</span>
      <a href="signup.html" class="btn btn-primary">Get started</a>
    </div>
  </div>
</header>

<main class="auth">
  <div class="auth-card">

    <div id="step1">
      <h1>Welcome back</h1>
      <p class="sub">Log in to see your case status and alerts.</p>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@email.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="pass">Password</label>
        <input id="pass" type="password" placeholder="Your password" autocomplete="current-password">
      </div>

      <div class="ferr" id="err1"></div>

      <button type="button" class="btn btn-primary btn-block" id="btn1">
        Log in
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>

      <div class="auth-sep">or</div>

      <button type="button" class="btn btn-oauth btn-block" id="google" style="display:none">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.7v3h3.9c2.3-2.1 3.5-5.2 3.5-8.9z"/><path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.4 14.4a7.2 7.2 0 0 1 0-4.6V6.7H1.4a12 12 0 0 0 0 10.7z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.4.6 4.6 1.8l3.4-3.4A11.5 11.5 0 0 0 12 0 12 12 0 0 0 1.4 6.7l4 3.1C6.3 6.9 8.9 4.8 12 4.8z"/></svg>
        Continue with Google
      </button>
      <button type="button" class="btn btn-apple btn-block" id="apple" style="display:none">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.7c0-2.4 2-3.6 2.1-3.6-1.1-1.7-2.9-1.9-3.6-1.9-1.5-.2-3 .9-3.7.9-.8 0-2-.9-3.2-.868-1.7.03-3.2 1-4 2.5-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.8 2.5 3 2.5 1.2-.05 1.7-.8 3.1-.8 1.4 0 1.9.8 3.2.77 1.3-.02 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8 0 0-2.4-.9-2.4-3.7zM14 5.2c.7-.8 1.1-2 1-3.2-1 .04-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3 1.1.1 2.2-.6 2.9-1.3z"/></svg>
        Continue with Apple
      </button>

      <p class="auth-alt">No account yet? <a href="signup.html">Create one — it's free</a></p>
      <p class="auth-fine"><a href="forgot.html">Forgot your password?</a></p>
    </div>

    <div id="step2" style="display:none;">
      <div class="mailer" aria-hidden="true">
        <svg viewBox="0 0 72 56">
          <rect class="body" x="4" y="14" width="64" height="38" rx="7"/>
          <rect class="paper" x="16" y="4" width="40" height="30" rx="4"/>
          <path class="line" d="M23 14h26M23 21h18"/>
          <path class="flap" d="M4 20 36 41 68 20"/>
          <path class="stamp" d="M27 33.5 33.5 40 46 26"/>
        </svg>
      </div>
      <h1>Check your email</h1>
      <p class="sub">We sent a six-digit code to <b id="sentTo"></b>. It works for ten minutes.</p>
      <div class="field">
        <label for="code">Code from the email</label>
        <input id="code" class="mono" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code">
      </div>
      <div class="ferr" id="err2"></div>
      <button type="button" class="btn btn-primary btn-block" id="btn2">Log in</button>
      <p class="auth-alt"><a href="#" id="again">Send the code again</a></p>
    </div>

  </div>
</main>

<script>
  document.documentElement.classList.remove("nojs");
  document.documentElement.classList.add("js");

  // Вход в два шага: пароль, затем код с почты — пароль сам по себе доступа не даёт.
  window.addEventListener("DOMContentLoaded", function () {
    CW.mountProviders();
    var carried = CW.carried();
    var email = document.getElementById("email");
    var step1 = document.getElementById("step1"), step2 = document.getElementById("step2");
    var err1 = document.getElementById("err1"), err2 = document.getElementById("err2");

    document.getElementById("btn1").addEventListener("click", function () {
      var btn = this;
      CW.err(err1, "");
      CW.pending(btn, true, "Checking…");
      CW.api("/api/auth/login", { email: email.value.trim(), password: document.getElementById("pass").value })
        .then(function (r) {
          CW.pending(btn, false);
          if (r.status !== 200) return CW.err(err1, msg(r));
          document.getElementById("sentTo").textContent = email.value.trim();
          step1.style.display = "none"; step2.style.display = "block";
          if (otp) otp.start(600);
          document.getElementById("code").focus();
        });
    });

    // код из шести цифр: как только набран — проверяем сами, кнопку жать не нужно
    var otp = CW.codeInput(document.getElementById("code"), function () {
      document.getElementById("btn2").click();
    });

    document.getElementById("btn2").addEventListener("click", function () {
      var btn = this;
      if (btn.disabled) return;
      CW.err(err2, "");
      CW.pending(btn, true, "Checking…");
      CW.api("/api/auth/2fa", { email: email.value.trim(), code: document.getElementById("code").value })
        .then(function (r) {
          if (r.status !== 200) { CW.pending(btn, false); if (otp) otp.shake(); return CW.err(err2, msg(r)); }
          if (otp) otp.win();               // волна по клеткам, потом уводим в кабинет
          setTimeout(function () {
            if (!carried) return location.replace("app.html");
            CW.api("/api/cases", carried).then(function () { location.replace("app.html"); });
          }, 760);
        });
    });

    document.getElementById("again").addEventListener("click", function (e) {
      e.preventDefault();
      CW.api("/api/auth/resend", { email: email.value.trim(), purpose: "login" })
        .then(function (r) {
          CW.err(err2, r.status === 200 ? "" : msg(r));
          if (r.status === 200 && otp) otp.start(600);   // новый код — новые десять минут
        });
    });

    function msg(r) {
      var e = (r.data && r.data.error) || "";
      if (e === "wrong email or password") return "Wrong email or password.";
      if (e === "wrong code") return "That code doesn't match. Check the email again.";
      if (e === "code expired") return "The code expired — send a new one.";
      if (e === "too many attempts") return "Too many tries. Send a new code.";
      if (e === "slow down" || e === "too many codes") return "Too many attempts. Try again in an hour.";
      return "Something went wrong. Try again.";
    }
  });
</script>
</body>
</html>
